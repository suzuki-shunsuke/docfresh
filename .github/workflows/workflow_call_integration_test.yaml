---
name: integration test
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
jobs:
  gomodule:
    uses: suzuki-shunsuke/download-go-module-action/.github/workflows/download.yaml@63db944fc861c4f6a4def7af7b0303f221e8bb5e # v0.0.3
    permissions:
      contents: read
      id-token: write
    with:
      artifact_name: gomodule-integration-test
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  integration-test:
    permissions:
      contents: read
    timeout-minutes: 20
    runs-on: ${{ matrix.runs-on }}
    needs: [gomodule]
    strategy:
      matrix:
        runs-on:
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: suzuki-shunsuke/download-go-module-action/restore@63db944fc861c4f6a4def7af7b0303f221e8bb5e # v0.0.3
        with:
          artifact_name: gomodule-integration-test

      - run: |
          go install -ldflags "-X main.version=v3.0.0-local -X main.commit=$GITHUB_SHA -X main.date=$(date +"%Y-%m-%dT%H:%M:%SZ%:z" | tr -d '+')" ./cmd/docfresh
      - run: docfresh -v
      # - run: docfresh init
      - run: docfresh run README.md examples/*.md
        env:
          DOCFRESH_GITHUB_TOKEN: ${{github.token}}
      - run: |
          if ! git diff --exit-code README.md examples; then
            echo "::error:: files are modified" >&2
            exit 1
          fi
